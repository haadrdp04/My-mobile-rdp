name: Real-Kali-Mobile-RDP
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    # 1. Install Tailscale CLI (Using your exact URL)
    - name: Install Tailscale CLI
      run: |
        curl -fsSL https://tailscale.com | sh

    # 2. Connect to Tailscale Network
    - name: Connect to Tailscale
      run: |
        sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname="real-kali-rdp"

    # 3. Add Official Kali Linux Repository & Keys (Using your exact URLs)
    - name: Add Kali Linux Repositories
      run: |
        sudo apt-get update
        sudo apt-get install -y gnupg wget curl debconf
        
        # 1. Your exact GPG Link
        sudo curl -fsSL https://kali.org -o /usr/share/keyrings/kali-archive-keyring.gpg
        
        # 2. Your exact Repo URL setup
        echo "deb [signed-by=/usr/share/keyrings/kali-archive-keyring.gpg] http://kali.org kali-rolling main contrib non-free non-free-firmware" | sudo tee /etc/apt/sources.list.d/kali.list

    # 4. Install Kali Tools & Desktop Environment (Fixed Architecture & Runner System Safety)
    - name: Install Kali Tools & Desktop
      run: |
        # Core system components protection block config
        sudo tee /etc/apt/preferences.d/kali-fix << 'EOF'
        Package: base-files
        Pin: release o=Kali
        Pin-Priority: -1

        Package: sysvinit-utils
        Pin: release o=Kali
        Pin-Priority: -1
        
        Package: cloud-init uuid-runtime dhcpcd-base tcpdump nvme-cli
        Pin: release o=Kali
        Pin-Priority: -1
        EOF

        # 1. Only update cache indexes without touching runner OS core tools
        sudo apt-get update || true

        # 2. Force seed specific package manager versions that Kali tools require
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --allow-unauthenticated \
          libegl1 xserver-xorg-core perl-base

        # 3. Bypass interactive Wireshark prompt locks automatically
        echo "wireshark-common wireshark-common/install-setuid boolean true" | sudo debconf-set-selections
        
        # 4. Install Kali Tools using strict overwrite rules to avoid environment blocks
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
          --allow-unauthenticated \
          --fix-broken \
          -o Dpkg::Options::="--force-confdef" \
          -o Dpkg::Options::="--force-confold" \
          -o Dpkg::Options::="--force-overwrite" \
          lxde lxpanel lxterminal xrdp \
          nmap sqlmap metasploit-framework wireshark aircrack-ng john hydra nikto gobuster wpscan net-tools
        
        # User configurations and remote desktop deployment rules
        sudo useradd -m -s /bin/bash kaliuser || true
        echo "kaliuser:MobileRDPPassword123!" | sudo chpasswd
        sudo usermod -aG sudo kaliuser
        
        echo "lxsession -s LXDE -e LXDE" | sudo tee /home/kaliuser/.xsession
        sudo chown kaliuser:kaliuser /home/kaliuser/.xsession
        
        sudo service xrdp restart

    # 5. Keep Server Alive (6 Hours)
    - name: Keep Server Alive
      run: |
        echo "=========================================="
        echo "Real Kali Linux Tools RDP is LIVE!"
        echo "Username: kaliuser"
        echo "Password: MobileRDPPassword123!"
        echo "=========================================="
        sleep 21600
