name: Real-Kali-Mobile-RDP
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    # 1. Run Kali Linux inside Docker (with XRDP stability fix)
    - name: Deploy Kali Linux & Tools via Docker
      run: |
        docker run -d --name kali-container --privileged \
          -p 3389:3389 \
          kalilinux/kali-rolling \
          bash -c "
            apt-get update && \
            DEBIAN_FRONTEND=noninteractive apt-get install -y \
            lxde xrdp kali-linux-default nmap sqlmap metasploit-framework wireshark john hydra nikto gobuster curl wget && \
            useradd -m -s /bin/bash kaliuser && \
            echo 'kaliuser:MobileRDPPassword123!' | chpasswd && \
            usermod -aG sudo kaliuser && \
            echo 'exec startlxde' > /home/kaliuser/.xsession && \
            chown kaliuser:kaliuser /home/kaliuser/.xsession && \
            rm -f /var/run/xrdp/xrdp.pid && \
            service xrdp start && \
            tail -f /dev/null
          "

    # 2. Start Raw TCP Tunnel via Bore (Works natively with any RDP app)
    - name: Start TCP Tunnel
      run: |
        curl -Ls https://github.com/ekzhang/bore/releases/download/v0.5.1/bore-v0.5.1-x86_64-unknown-linux-musl.tar.gz | tar zx
        nohup ./bore local 3389 --to bore.pub > bore.log 2>&1 &
        sleep 5
        echo "=========================================="
        echo "RDP CONNECTION DETAILS:"
        echo "Put this exactly in your RDP App:"
        grep -o 'bore.pub:[0-9]*' bore.log || cat bore.log
        echo "=========================================="
        
    # 3. Keep Server Alive (6 Hours)
    - name: Keep Server Alive
      run: |
        sleep 21600