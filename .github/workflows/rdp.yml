name: Windows-Native-RDP
on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    steps:
      # 1. Enable Windows RDP Built-in Feature
      - name: Enable Remote Desktop
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

      # 2. Install Tailscale CLI on Windows
      - name: Install Tailscale
        run: |
          winget install Tailscale.Tailscale --silent

      # 3. Connect to Tailscale Network
      - name: Connect to Tailscale
        run: |
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname="windows-rdp-server"

      # 4. Show IP Details & Keep Alive
      - name: Keep Server Alive
        run: |
          Write-Host "=========================================="
          Write-Host "Windows Native RDP is LIVE!"
          Write-Host "Tailscale IP:"
          & "C:\Program Files\Tailscale\tailscale.exe" ip -4
          Write-Host "Username: runneradmin"
          Write-Host "Password Check runner profile or default"
          Write-Host "=========================================="
          Start-Sleep -Seconds 21600