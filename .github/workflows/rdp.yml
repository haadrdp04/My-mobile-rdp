name: Windows-Native-RDP
on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    steps:
      # 1. Enable Windows RDP Built-in Feature
      - name: Enable Remote Desktop
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

      # 2. Set Password for runneradmin
      - name: Set RDP Password
        run: |
          net user runneradmin "MobileRDPPassword123!"

      # 3. Download & Install Tailscale Silently (Bypassing winget prompt)
      - name: Install Tailscale Silently
        run: |
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.msi" -OutFile "tailscale-setup.msi"
          Start-Process msiexec.exe -ArgumentList '/i tailscale-setup.msi /quiet /norestart' -Wait

      # 4. Connect to Tailscale Network
      - name: Connect to Tailscale
        run: |
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname="windows-rdp-server"

      # 5. Show IP Details & Keep Alive
      - name: Keep Server Alive
        run: |
          Write-Host "=========================================="
          Write-Host "Windows Native RDP is LIVE!"
          Write-Host "Tailscale IP:"
          & "C:\Program Files\Tailscale\tailscale.exe" ip -4
          Write-Host "Username: runneradmin"
          Write-Host "Password: MobileRDPPassword123!"
          Write-Host "=========================================="
          Start-Sleep -Seconds 21600