name: Real-Kali-Mobile-RDP
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    # 1. Install Tailscale CLI
    - name: Install Tailscale CLI
      run: |
        curl -fsSL https://tailscale.com/install.sh | sh

    # 2. Connect to Tailscale Network
    - name: Connect to Tailscale
      run: |
        sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname="real-kali-rdp"

    # 3. Add Official Kali Linux Repository & Keys
    - name: Add Kali Linux Repositories
      run: |
        sudo apt-get update
        sudo apt-get install -y gnupg wget curl debconf
        
        # Sahi GPG Keyring link:
        sudo curl -fsSL https://archive.kali.org/archive-keyring.gpg -o /usr/share/keyrings/kali-archive-keyring.gpg
        
        # Sahi Repository URL:
        echo "deb [signed-by=/usr/share/keyrings/kali-archive-keyring.gpg] http://http.kali.org/kali kali-rolling main contrib non-free non-free-firmware" | sudo tee /etc/apt/sources.list.d/kali.list

    
        # 4. Install Kali Tools & Desktop Environment
    name: Install Kali Tools & Desktop
    run: |
      # 1. APT Pinning setup karein taaki Kali ke core base-files Ubuntu ko crash na karein
      sudo tee /etc/apt/preferences.d/kali-fix << 'EOF'
      Package: base-files
      Pin: release o=Kali
      Pin-Priority: -1

      Package: sysvinit-utils
      Pin: release o=Kali
      Pin-Priority: -1
      EOF

      # Package updates cache refresh karein
      sudo apt-get update || true
      
      # Wireshark ke background prompt ko automatic bypass karein
      echo "wireshark-common wireshark-common/install-setuid boolean true" | sudo debconf-set-selections
      
      # Force parameters ke sath packages install karein (ab base-files error nahi aayega)
      sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
        --allow-unauthenticated \
        --fix-broken \
        -o Dpkg::Options::="--force-confdef" \
        -o Dpkg::Options::="--force-confold" \
        -o Dpkg::Options::="--force-overwrite" \
        lxde lxpanel lxterminal xrdp \
        nmap sqlmap metasploit-framework wireshark aircrack-ng john hydra nikto gobuster wpscan net-tools
      
      # User aur RDP management configurations
      sudo useradd -m -s /bin/bash kaliuser || true
      echo "kaliuser:MobileRDPPassword123!" | sudo chpasswd
      sudo usermod -aG sudo kaliuser
      
      echo "lxsession -s LXDE -e LXDE" | sudo tee /home/kaliuser/.xsession
      sudo chown kaliuser:kaliuser /home/kaliuser/.xsession
      
      sudo service xrdp restart