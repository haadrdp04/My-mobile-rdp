name: Real-Kali-Mobile-RDP
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    # 1. Install Cloudflared
    - name: Install Cloudflare Tunnel
      run: |
        curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
        sudo dpkg -i cloudflared.deb

    # 2. Run Kali Linux inside Docker & Expose via XRDP
    - name: Deploy Kali Linux & Tools via Docker
      run: |
        docker run -d --name kali-container --privileged \
          -p 3389:3389 \
          kalilinux/kali-rolling \
          bash -c "
            apt-get update && \
            DEBIAN_FRONTEND=noninteractive apt-get install -y \
            lxde xrdp kali-linux-default nmap sqlmap metasploit-framework wireshark john hydra nikto gobuster && \
            useradd -m -s /bin/bash kaliuser && \
            echo 'kaliuser:MobileRDPPassword123!' | chpasswd && \
            usermod -aG sudo kaliuser && \
            echo 'exec startlxde' > /home/kaliuser/.xsession && \
            chown kaliuser:kaliuser /home/kaliuser/.xsession && \
            service xrdp start && \
            tail -f /dev/null
          "

    # 3. Start Cloudflare Tunnel for TCP Port 3389
    - name: Start Cloudflare Tunnel
      run: |
        nohup cloudflared tunnel --url rdp://localhost:3389 > cf.log 2>&1 &
        sleep 5
        echo "=========================================="
        echo "CLOUDFLARE RDP URL:"
        grep -o 'https://[-0-9a-z]*\.trycloudflare.com' cf.log || echo "Check logs for URL"
        echo "=========================================="
        
    # 4. Keep Server Alive (6 Hours)
    - name: Keep Server Alive
      run: |
        sleep 21600