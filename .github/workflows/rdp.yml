name: Real-Kali-Mobile-RDP
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    # 1. Install Tailscale CLI
    - name: Install Tailscale CLI
      run: |
        curl -fsSL https://tailscale.com/install.sh | sh

    # 2. Connect to Tailscale Network and get its IP
    - name: Connect to Tailscale
    - name: Connect to Tailscale
      run: |
        sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname="real-kali-rdp"
        echo "TAILSCALE_IP=$(tailscale ip -4)" >> $GITHUB_ENV

    # 3. Run Kali Linux inside Docker
    - name: Deploy Kali Linux & Tools via Docker
      run: |
        docker run -d --name kali-container --privileged \
          -p 3389:3389 \
          kalilinux/kali-rolling \
          bash -c "
            apt-get update && \
            DEBIAN_FRONTEND=noninteractive apt-get install -y \
            lxde xrdp kali-linux-default nmap sqlmap metasploit-framework wireshark john hydra nikto gobuster && \
            useradd -m -s /bin/bash kaliuser && \
            echo 'kaliuser:MobileRDPPassword123!' | chpasswd && \
            usermod -aG sudo kaliuser && \
            echo 'exec startlxde' > /home/kaliuser/.xsession && \
            chown kaliuser:kaliuser /home/kaliuser/.xsession && \
            service xrdp start && \
            tail -f /dev/null
          "

    # 4. Show Connection Details & Keep Server Alive (6 Hours)
    - name: Keep Server Alive
      run: |
        echo "=========================================="
        echo "Real Kali Linux Docker RDP is LIVE!"
        echo "Tailscale IP to connect: ${{ env.TAILSCALE_IP }}"
        echo "Port: 3389"
        echo "Username: kaliuser"
        echo "Password: MobileRDPPassword123!"
        echo "=========================================="
        sleep 21600