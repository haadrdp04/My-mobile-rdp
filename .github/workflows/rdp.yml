name: Real-Kali-Mobile-RDP
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    # 1. Deploy Kali Linux & Tools via Docker
    - name: Deploy Kali Linux & Tools via Docker
      run: |
        docker run -d --name kali-container --privileged \
          -p 3389:3389 \
          kalilinux/kali-rolling \
          bash -c "
            apt-get update && \
            DEBIAN_FRONTEND=noninteractive apt-get install -y \
            lxde xrdp kali-linux-default nmap sqlmap metasploit-framework wireshark john hydra nikto gobuster curl wget openssh-client && \
            useradd -m -s /bin/bash kaliuser && \
            echo 'kaliuser:MobileRDPPassword123!' | chpasswd && \
            usermod -aG sudo kaliuser && \
            echo 'exec startlxde' > /home/kaliuser/.xsession && \
            chown kaliuser:kaliuser /home/kaliuser/.xsession && \
            rm -f /var/run/xrdp/xrdp.pid && \
            service xrdp start && \
            tail -f /dev/null
          "

    # 2. Start Direct Raw TCP Tunnel via Pinggy (No heavy npm install needed)
    - name: Start Pinggy TCP Tunnel
      run: |
        echo "Starting Pinggy TCP tunnel for RDP..."
        nohup ssh -o StrictHostKeyChecking=no -p 443 -R0:localhost:3389 tcp.pinggy.io > pinggy.log 2>&1 &
        sleep 8
        echo "=========================================="
        echo "PINGGY RDP CONNECTION DETAILS:"
        cat pinggy.log
        echo "=========================================="
        echo "LOCALTUNNEL RDP URL / DETAILS:"
        cat lt.log
        echo "=========================================="
        
    # 3. Keep Server Alive (6 Hours)
    - name: Keep Server Alive
      run: |
        sleep 21600