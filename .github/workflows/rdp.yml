- name: Install Tools & Desktop (Clean & Fixed)
      run: |
        # Core system components and library safety protection block config
        sudo tee /etc/apt/preferences.d/kali-fix << 'EOF'
        Package: *
        Pin: release o=Kali
        Pin-Priority: -1
        EOF

        # 1. Refresh packages catalog index securely
        sudo apt-get update || true

        # 2. Pre-seed basic desktop configs and bypass Wireshark prompt locks automatically
        echo "wireshark-common wireshark-common/install-setuid boolean true" | sudo debconf-set-selections
        
        # 3. Install Desktop environment, XRDP, and core tools cleanly from Ubuntu repos to avoid version hell
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
          lxde lxpanel lxterminal xrdp \
          nmap sqlmap aircrack-ng john hydra gobuster net-tools curl wget git
        
        # User configurations and remote desktop deployment rules
        sudo useradd -m -s /bin/bash kaliuser || true
        echo "kaliuser:MobileRDPPassword123!" | sudo chpasswd
        sudo usermod -aG sudo kaliuser
        
        echo "lxsession -s LXDE -e LXDE" | sudo tee /home/kaliuser/.xsession
        sudo chown kaliuser:kaliuser /home/kaliuser/.xsession
        
        sudo service xrdp restart