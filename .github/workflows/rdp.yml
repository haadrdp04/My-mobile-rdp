name: Kali-Mobile-RDP-Tailscale
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    # 1. Tailscale Download & Install
    - name: Install Tailscale CLI
      run: |
        curl -fsSL https://tailscale.com/install.sh | sh

    # 2. Connect to Tailscale Network
    - name: Connect to Tailscale
      run: |
        sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname="github-kali-rdp"

    # 3. Display IP Address in Logs
    - name: Display IP Address
      run: |
        tailscale ip -4

    # 4. Install Desktop & RDP
    - name: Install LXDE Desktop & RDP
      run: |
        sudo apt-get update
        sudo apt-get install -y lxde xrdp net-tools curl wget git python3
        
        # User Setup
        sudo useradd -m -s /bin/bash kaliuser || true
        echo "kaliuser:MobileRDPPassword123!" | sudo chpasswd
        sudo usermod -aG sudo kaliuser
        
        # Smooth LXDE Session Setup
        echo "lxsession -s LXDE -e LXDE" | sudo tee /home/kaliuser/.xsession
        sudo chown kaliuser:kaliuser /home/kaliuser/.xsession
        
        # Restart RDP Service
        sudo service xrdp restart

    # 5. Keep Alive 6 Hours
    - name: Keep Server Alive
      run: |
        echo "=========================================="
        echo "Linux RDP is LIVE on Tailscale!"
        echo "Username: kaliuser"
        echo "Password: MobileRDPPassword123!"
        echo "=========================================="
        sleep 21600