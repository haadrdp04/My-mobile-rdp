name: Windows RDP via Tailscale

on:
  workflow_dispatch:

jobs:
  rdp-session:
    runs-on: windows-latest
    timeout-minutes: 360 # 6 hours maximum runtime

    steps:
      - name: Configure RDP User
        shell: powershell
        run: |
          $username = "runneradmin"
          $password = "112233445566"
          $secPassword = ConvertTo-SecureString $password -AsPlainText -Force
          
          # Check if user already exists
          if (Get-LocalUser -Name $username -ErrorAction SilentlyContinue) {
              Write-Host "User $username already exists. Updating password..."
              Set-LocalUser -Name $username -Password $secPassword
          } else {
              Write-Host "Creating new local user $username..."
              New-LocalUser -Name $username -Password $secPassword -Description "RDP Access User"
              Add-LocalGroupMember -Group "Administrators" -Member $username
              Add-LocalGroupMember -Group "Remote Desktop Users" -Member $username
          }
          
          # Enable Remote Desktop service and configure firewall
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-Service -Name "TermService" -StartupType Automatic
          Start-Service -Name "TermService" -WarningAction SilentlyContinue
          
          Write-Host "=========================================="
          Write-Host "RDP CREDENTIALS CONFIGURED SUCCESSFULLY"
          Write-Host "Username: $username"
          Write-Host "Password: $password"
          Write-Host "=========================================="

      - name: Connect to Tailscale Network
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
          hostname: gh-win-runner

      - name: Maintain Active Connection Session
        shell: powershell
        run: |
          Write-Host "=========================================================="
          Write-Host "FETCHING IP ADDRESS TO CONNECT..."
          
          # Retrieve the assigned Tailscale network IP
          $tsIp = (tailscale ip -4).Trim()
          
          Write-Host "=========================================================="
          Write-Host "      TAILSCALE RDP ACTIVE SESSION INFRASTRUCTURE"
          Write-Host "=========================================================="
          Write-Host " Connection Target IP : $tsIp"
          Write-Host " Access Credentials   : runneradmin / 112233445566"
          Write-Host "=========================================================="
          Write-Host "Keep this action runner log tab open to sustain your session."
          
          # Loop execution block to keep runner alive for the duration limits
          $timeout = New-TimeSpan -Hours 6
          $sw = [diagnostics.stopwatch]::StartNew()
          while ($sw.Elapsed -lt $timeout) {
              Start-Sleep -Seconds 60
              Write-Host "Session heartbeat status check: Active. Elapsed time: $($sw.Elapsed.ToString('hh\:mm\:ss'))"
          }
