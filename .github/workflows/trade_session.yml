name: Automated MT5 Trading Session

on:
  workflow_dispatch:

jobs:
  launch-trader:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: 1. Install Official Exness MT5
        run: |
          Write-Host "Downloading official Exness MT5 installer..."
          Invoke-WebRequest -Uri "https://download.mql5.com/cdn/web/exness.technologies.ltd/mt5/exness5setup.exe" -OutFile "exness5setup.exe"
          
          Write-Host "Installing Exness MT5..."
          Start-Process -FilePath ".\exness5setup.exe" -ArgumentList "/auto /path:`"C:\Program Files\MetaTrader 5`"" -Wait
          
          # Clean demo bloat
          Get-ChildItem -Path "C:\Program Files\MetaTrader 5\MQL5" -Directory -Recurse -ErrorAction SilentlyContinue | 
            Where-Object { @("Examples", "Free Robots", "Free Indicators", "Advisors") -contains $_.Name } | 
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue

      - name: 2. Compile Our EA
        run: |
          $targetDir = "C:\Program Files\MetaTrader 5\MQL5\Experts"
          if (-not (Test-Path $targetDir)) { New-Item -ItemType Directory -Path $targetDir -Force }

          $eaPath = Get-ChildItem -Recurse -Filter "InstitutionalAlgoEA.mq5" | Select-Object -ExpandProperty FullName -First 1
          Copy-Item -Path $eaPath -Destination "$targetDir\InstitutionalAlgoEA.mq5" -Force

          Write-Host "Compiling InstitutionalAlgoEA.mq5..."
          $compileLog = "C:\Program Files\MetaTrader 5\compile.log"
          Start-Process -FilePath "C:\Program Files\MetaTrader 5\metaeditor64.exe" -ArgumentList "/compile:`"$targetDir\InstitutionalAlgoEA.mq5`"", "/log:`"$compileLog`"" -Wait

          Start-Sleep -Seconds 3
          $ex5File = "$targetDir\InstitutionalAlgoEA.ex5"
          if (Test-Path $ex5File) {
            Write-Host ">>> SUCCESS: InstitutionalAlgoEA.ex5 ready! <<<"
          } else {
            Write-Error "Compile failed."
            exit 1
          }

      - name: 3. Create Login Config
        env:
          EXNESS_LOGIN: ${{ secrets.EXNESS_LOGIN }}
          EXNESS_PASSWORD: ${{ secrets.EXNESS_PASSWORD }}
          EXNESS_SERVER: ${{ secrets.EXNESS_SERVER }}
        run: |
          $configContent = @"
          [Common]
          Login=$env:EXNESS_LOGIN
          Password=$env:EXNESS_PASSWORD
          Server=$env:EXNESS_SERVER

          [Experts]
          Enabled=1
          Account=$env:EXNESS_LOGIN
          AllowDLL=0

          [Start]
          Symbol=BTCUSDm
          Period=M5
          Expert=InstitutionalAlgoEA
          "@
          Set-Content -Path "C:\Program Files\MetaTrader 5\startup.ini" -Value $configContent

      - name: 4. Launch MT5 & Run Bot
        run: |
          Write-Host "Starting Exness MT5..."
          Start-Process -FilePath "C:\Program Files\MetaTrader 5\terminal64.exe" -ArgumentList "/portable /config:`"C:\Program Files\MetaTrader 5\startup.ini`""
          
          Write-Host "Waiting 75 seconds for login, chart open, and trade..."
          Start-Sleep -Seconds 75

      - name: 5. PRINT REAL BROKER CONNECTION LOGS
        run: |
          Write-Host "=== SEARCHING ALL LOG LOCATIONS ==="
          # Search both Program Files and AppData for the real terminal log
          $allLogs = Get-ChildItem -Path "C:\Program Files\MetaTrader 5\Logs\*.log", "$env:APPDATA\MetaQuotes\Terminal\*\Logs\*.log" -ErrorAction SilentlyContinue | Sort-Object LastWriteTime
          
          if ($allLogs) {
            $latest = $allLogs[-1].FullName
            Write-Host "Reading log: $latest"
            Get-Content $latest -Encoding Unicode | Select-Object -Last 40
          } else {
            Write-Host "No terminal log files found anywhere."
          }

      - name: 6. PRINT BOT EXECUTION LOGS
        run: |
          Write-Host "=== SEARCHING ALL EA LOG LOCATIONS ==="
          $allEaLogs = Get-ChildItem -Path "C:\Program Files\MetaTrader 5\MQL5\Logs\*.log", "$env:APPDATA\MetaQuotes\Terminal\*\MQL5\Logs\*.log" -ErrorAction SilentlyContinue | Sort-Object LastWriteTime
          
          if ($allEaLogs) {
            $latestEa = $allEaLogs[-1].FullName
            Write-Host "Reading EA log: $latestEa"
            Get-Content $latestEa -Encoding Unicode -Tail 40
          } else {
            Write-Host "No EA log found yet."
          }