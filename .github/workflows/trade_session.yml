name: Automated MT5 Trading Session

on:
  workflow_dispatch:

jobs:
  launch-trader:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install MT5 Silently
        run: |
          Invoke-WebRequest -Uri "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" -OutFile "mt5setup.exe"
          Start-Process -FilePath ".\mt5setup.exe" -ArgumentList "/auto /path:`"C:\Program Files\MetaTrader 5`"" -Wait
          Start-Sleep -Seconds 15

      - name: Setup Python & MT5 Library
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install MetaTrader5 Python Package
        run: |
          pip install MetaTrader5

      - name: Run Live Broker Connection & Trade Test
        env:
          EXNESS_LOGIN: ${{ secrets.EXNESS_LOGIN }}
          EXNESS_PASSWORD: ${{ secrets.EXNESS_PASSWORD }}
          EXNESS_SERVER: ${{ secrets.EXNESS_SERVER }}
        run: |
          python -c @"
          import os
          import MetaTrader5 as mt5

          login_raw = os.environ.get('EXNESS_LOGIN')
          password = os.environ.get('EXNESS_PASSWORD')
          server = os.environ.get('EXNESS_SERVER')

          print('=== STARTING MT5 TEST ===')
          print(f'Attempting connection to Server: {server} with Login: {login_raw}')

          if not mt5.initialize('C:\\Program Files\\MetaTrader 5\\terminal64.exe'):
              print('MT5 initialize failed:', mt5.last_error())
              exit(1)

          authorized = mt5.login(int(login_raw), password=password, server=server)
          if not authorized:
              print('>>> LOGIN FAILED! Error:', mt5.last_error())
              mt5.shutdown()
              exit(1)

          print('>>> LOGIN SUCCESSFUL! <<<')
          acc = mt5.account_info()
          print(f'Account Name: {acc.name}')
          print(f'Account Balance: {acc.balance} {acc.currency}')
          print(f'Account Server: {acc.server}')

          # Test Symbol Selection
          symbol = 'BTCUSDm'
          if not mt5.symbol_select(symbol, True):
              print(f'Symbol {symbol} not found! Searching for available BTC symbols on broker...')
              symbols = mt5.symbols_get('*BTC*')
              if symbols:
                  print('Available symbols on your broker:', [s.name for s in symbols])
                  symbol = symbols[0].name
              else:
                  print('No crypto symbols found.')
                  mt5.shutdown()
                  exit(1)

          # Place Test Order
          price = mt5.symbol_info_tick(symbol).ask
          point = mt5.symbol_info(symbol).point
          request = {
              'action': mt5.TRADE_ACTION_DEAL,
              'symbol': symbol,
              'volume': 0.01,
              'type': mt5.ORDER_TYPE_BUY,
              'price': price,
              'sl': price * 0.99,
              'tp': price * 1.01,
              'deviation': 20,
              'magic': 123456,
              'comment': 'Python Test',
              'type_time': mt5.ORDER_TIME_GTC,
              'type_filling': mt5.ORDER_FILLING_IOC,
          }

          result = mt5.order_send(request)
          if result.retcode != mt5.TRADE_RETCODE_DONE:
              print(f'Order failed, retcode={result.retcode}, comment={result.comment}')
          else:
              print(f'>>> SUCCESS! Trade placed! Ticket #{result.order} on {symbol} at {price} <<<')

          mt5.shutdown()
          "@