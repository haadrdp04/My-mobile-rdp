name: Automated MT5 Trading Session

on:
  workflow_dispatch:

jobs:
  launch-trader:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: 1. Install MT5 & Remove Demo Bloat
        run: |
          Invoke-WebRequest -Uri "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" -OutFile "mt5setup.exe"
          Start-Process -FilePath ".\mt5setup.exe" -ArgumentList "/auto /path:`"C:\Program Files\MetaTrader 5`"" -Wait
          
          # Delete built-in demo examples so MT5 doesn't waste 2 minutes compiling them
          Write-Host "Removing demo bloat to make startup instant..."
          $demoFolders = @("Examples", "Free Robots", "Free Indicators", "Advisors")
          Get-ChildItem -Path "C:\Program Files\MetaTrader 5\MQL5" -Directory -Recurse -ErrorAction SilentlyContinue | 
            Where-Object { $demoFolders -contains $_.Name } | 
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue

      - name: 2. Compile Our EA
        run: |
          $targetDir = "C:\Program Files\MetaTrader 5\MQL5\Experts"
          if (-not (Test-Path $targetDir)) { New-Item -ItemType Directory -Path $targetDir -Force }

          $eaPath = Get-ChildItem -Recurse -Filter "InstitutionalAlgoEA.mq5" | Select-Object -ExpandProperty FullName -First 1
          Copy-Item -Path $eaPath -Destination "$targetDir\InstitutionalAlgoEA.mq5" -Force

          Write-Host "Compiling InstitutionalAlgoEA.mq5..."
          $compileLog = "C:\Program Files\MetaTrader 5\compile.log"
          Start-Process -FilePath "C:\Program Files\MetaTrader 5\metaeditor64.exe" -ArgumentList "/compile:`"$targetDir\InstitutionalAlgoEA.mq5`"", "/log:`"$compileLog`"" -Wait

          Start-Sleep -Seconds 3
          $ex5File = "$targetDir\InstitutionalAlgoEA.ex5"
          if (Test-Path $ex5File) {
            Write-Host ">>> SUCCESS: InstitutionalAlgoEA.ex5 ready! <<<"
          } else {
            Write-Error "Compile failed."
            exit 1
          }

      - name: 3. Create Login Config
        env:
          EXNESS_LOGIN: ${{ secrets.EXNESS_LOGIN }}
          EXNESS_PASSWORD: ${{ secrets.EXNESS_PASSWORD }}
          EXNESS_SERVER: ${{ secrets.EXNESS_SERVER }}
        run: |
          $configContent = @"
          [Common]
          Login=$env:EXNESS_LOGIN
          Password=$env:EXNESS_PASSWORD
          Server=$env:EXNESS_SERVER

          [Experts]
          Enabled=1
          Account=$env:EXNESS_LOGIN
          AllowDLL=0

          [Start]
          Symbol=BTCUSDm
          Period=M5
          Expert=InstitutionalAlgoEA
          "@
          Set-Content -Path "C:\Program Files\MetaTrader 5\startup.ini" -Value $configContent

      - name: 4. Launch MT5 & Run Bot (60s)
        run: |
          Write-Host "Starting MT5 and connecting directly to broker..."
          Start-Process -FilePath "C:\Program Files\MetaTrader 5\terminal64.exe" -ArgumentList "/portable /config:`"C:\Program Files\MetaTrader 5\startup.ini`""
          
          # Now boots in 3s, giving 55s purely for connection & trade execution
          Start-Sleep -Seconds 60

      - name: 5. PRINT BROKER CONNECTION LOGS
        run: |
          Write-Host "=== BROKER & LOGIN EVENTS ==="
          $logs = Get-ChildItem -Path "C:\Program Files\MetaTrader 5\Logs\*.log" -ErrorAction SilentlyContinue
          if ($logs) {
            # Filter out all compilation lines completely
            Get-Content $logs[-1].FullName -Encoding Unicode | Where-Object { $_ -notmatch "Compile" -and $_ -notmatch "Compiler" } | Select-Object -Last 30
          } else {
            Write-Host "No log file found."
          }

      - name: 6. PRINT BOT EXECUTION LOGS
        run: |
          Write-Host "=== EXPERT ADVISOR (TRADE) LOG ==="
          $eaLogs = Get-ChildItem -Path "C:\Program Files\MetaTrader 5\MQL5\Logs\*.log" -ErrorAction SilentlyContinue
          if ($eaLogs) {
            Get-Content $eaLogs[-1].FullName -Encoding Unicode -Tail 30
          } else {
            Write-Host "No EA log found yet."
          }