
name: Automated MT5 Trading Session

on:
  workflow_dispatch:

jobs:
  launch-trader:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: 1. Install MT5
        run: |
          Invoke-WebRequest -Uri "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" -OutFile "mt5setup.exe"
          Start-Process -FilePath ".\mt5setup.exe" -ArgumentList "/auto /path:`"C:\Program Files\MetaTrader 5`""
          
          $timeout = 30
          while ($timeout -gt 0) {
            if (Test-Path "C:\Program Files\MetaTrader 5\terminal64.exe") { break }
            Start-Sleep -Seconds 4
            $timeout--
          }

      - name: 2. Compile EA
        run: |
          $targetDir = "C:\Program Files\MetaTrader 5\MQL5\Experts"
          if (-not (Test-Path $targetDir)) { New-Item -ItemType Directory -Path $targetDir -Force }

          $eaPath = Get-ChildItem -Recurse -Filter "InstitutionalAlgoEA.mq5" | Select-Object -ExpandProperty FullName -First 1
          Copy-Item -Path $eaPath -Destination "$targetDir\InstitutionalAlgoEA.mq5" -Force

          & "C:\Program Files\MetaTrader 5\metaeditor64.exe" /compile:"$targetDir\InstitutionalAlgoEA.mq5" /log:"C:\Program Files\MetaTrader 5\compile.log"

      - name: 3. Create Login Config
        env:
          EXNESS_LOGIN: ${{ secrets.EXNESS_LOGIN }}
          EXNESS_PASSWORD: ${{ secrets.EXNESS_PASSWORD }}
          EXNESS_SERVER: ${{ secrets.EXNESS_SERVER }}
        run: |
          $configContent = @"
          [Common]
          Login=$env:EXNESS_LOGIN
          Password=$env:EXNESS_PASSWORD
          Server=$env:EXNESS_SERVER

          [Experts]
          Enabled=1
          Account=$env:EXNESS_LOGIN
          AllowDLL=0

          [Start]
          Symbol=BTCUSDm
          Period=M5
          Expert=InstitutionalAlgoEA
          "@
          Set-Content -Path "C:\Program Files\MetaTrader 5\startup.ini" -Value $configContent

      - name: 4. Launch MT5 & Wait 45s
        run: |
          Start-Process -FilePath "C:\Program Files\MetaTrader 5\terminal64.exe" -ArgumentList "/portable /config:`"C:\Program Files\MetaTrader 5\startup.ini`""
          Start-Sleep -Seconds 45

      - name: 5. VIEW COMPILER LOG
        run: |
          if (Test-Path "C:\Program Files\MetaTrader 5\compile.log") {
            Get-Content "C:\Program Files\MetaTrader 5\compile.log"
          } else {
            Write-Host "No compile log found."
          }

      - name: 6. VIEW EXNESS CONNECTION LOG
        run: |
          $logs = Get-ChildItem -Path "C:\Program Files\MetaTrader 5\Logs\*.log", "$env:APPDATA\MetaQuotes\Terminal\*\Logs\*.log" -ErrorAction SilentlyContinue
          if ($logs) {
            Get-Content $logs[-1].FullName -Tail 40
          } else {
            Write-Host "No connection log found yet."
          }

      - name: 7. VIEW BOT EXECUTION LOG
        run: |
          $eaLogs = Get-ChildItem -Path "C:\Program Files\MetaTrader 5\MQL5\Logs\*.log", "$env:APPDATA\MetaQuotes\Terminal\*\MQL5\Logs\*.log" -ErrorAction SilentlyContinue
          if ($eaLogs) {
            Get-Content $eaLogs[-1].FullName -Tail 40
          } else {
            Write-Host "No EA log found yet."
          }