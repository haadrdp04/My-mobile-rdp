name: Automated MT5 Trading Session

on:
  workflow_dispatch:

jobs:
  launch-trader:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: 1. Install Official Exness MT5
        run: |
          Write-Host "Downloading Exness MT5..."
          Invoke-WebRequest -Uri "https://download.mql5.com/cdn/web/exness.technologies.ltd/mt5/exness5setup.exe" -OutFile "exness5setup.exe"
          Start-Process -FilePath ".\exness5setup.exe" -ArgumentList "/auto /path:`"C:\Program Files\MetaTrader 5`"" -Wait

      - name: 2. Compile Our EA
        run: |
          $targetDir = "C:\Program Files\MetaTrader 5\MQL5\Experts"
          if (-not (Test-Path $targetDir)) { New-Item -ItemType Directory -Path $targetDir -Force }

          $eaPath = Get-ChildItem -Recurse -Filter "InstitutionalAlgoEA.mq5" | Select-Object -ExpandProperty FullName -First 1
          Copy-Item -Path $eaPath -Destination "$targetDir\InstitutionalAlgoEA.mq5" -Force

          Start-Process -FilePath "C:\Program Files\MetaTrader 5\metaeditor64.exe" -ArgumentList "/compile:`"$targetDir\InstitutionalAlgoEA.mq5`"", "/log:`"C:\Program Files\MetaTrader 5\compile.log`"" -Wait
          Write-Host ">>> EA Compiled! <<<"

      - name: 3. Create Login Config
        env:
          EXNESS_LOGIN: ${{ secrets.EXNESS_LOGIN }}
          EXNESS_PASSWORD: ${{ secrets.EXNESS_PASSWORD }}
          EXNESS_SERVER: ${{ secrets.EXNESS_SERVER }}
        run: |
          $configContent = @"
          [Common]
          Login=$env:EXNESS_LOGIN
          Password=$env:EXNESS_PASSWORD
          Server=$env:EXNESS_SERVER

          [Experts]
          Enabled=1
          Account=$env:EXNESS_LOGIN
          AllowDLL=0

          [Start]
          Symbol=BTCUSDm
          Period=M5
          Expert=InstitutionalAlgoEA
          "@
          Set-Content -Path "C:\Program Files\MetaTrader 5\startup.ini" -Value $configContent

      - name: 4. Launch MT5 & Run Bot (150s)
        run: |
          Write-Host "Starting Exness MT5..."
          Start-Process -FilePath "C:\Program Files\MetaTrader 5\terminal64.exe" -ArgumentList "/portable /config:`"C:\Program Files\MetaTrader 5\startup.ini`""
          
          # 150 seconds: enough time to open chart & fire trade
          Start-Sleep -Seconds 150

      - name: 5. PRINT BROKER & SYMBOL EVENTS
        run: |
          Write-Host "=== LATEST BROKER & CHART EVENTS ==="
          $allLogs = Get-ChildItem -Path "C:\Program Files\MetaTrader 5\Logs\*.log", "$env:APPDATA\MetaQuotes\Terminal\*\Logs\*.log" -ErrorAction SilentlyContinue | Sort-Object LastWriteTime
          if ($allLogs) {
            Get-Content $allLogs[-1].FullName -Encoding Unicode | Select-Object -Last 35
          }

      - name: 6. PRINT BOT EXECUTION LOGS
        run: |
          Write-Host "=== EXPERT ADVISOR (TRADE) LOG ==="
          $allEaLogs = Get-ChildItem -Path "C:\Program Files\MetaTrader 5\MQL5\Logs\*.log", "$env:APPDATA\MetaQuotes\Terminal\*\MQL5\Logs\*.log" -ErrorAction SilentlyContinue | Sort-Object LastWriteTime
          if ($allEaLogs) {
            Get-Content $allEaLogs[-1].FullName -Encoding Unicode -Tail 35
          } else {
            Write-Host "No EA log found yet."
          }